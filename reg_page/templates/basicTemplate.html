<!DOCTYPE html> 
<html> 
<head> 
    <title>{% block title %}Student Course Registration{% endblock %}</title> 
    <style> 
        nav { 
            background-color: lightblue; 
            padding: 15px; 
        } 
        nav a { 
            color: white; 
            text-decoration: none; 
            padding: 10px 20px; 
            margin: 0 10px; 
            border-radius: 5px; 
            background-color: #555; 
        } 
        nav a:hover { 
            background-color: aqua; 
        } 
        ul { 
            list-style: none; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-wrap: wrap; 
            flex-direction: row; 
        } 
        li { 
            margin-right: 20px; 
            margin-bottom: 25px; 
        } 
        h1 { 
            background-color: blue; 
            color: yellow; 
            padding: 10px; 
        } 
        footer { 
            margin-top: 20px; 
            text-align: center; 
        } 
    </style> 
</head> 
<body> 
    <center> 
        <h1>STUDENT COURSE REGISTRATION PORTAL</h1> 
    </center> 
    <nav> 
        <ul> 
            <li><a href="/mainpage/">HOME</a></li> 
            <li><a href="/studentlist/">STUDENT LIST</a></li> 
            <li><a href="/courselist/">COURSE LIST</a></li> 
            <li><a href="/register/">REGISTER</a></li> 
            <li><a href="/enrolledlist/">ENROLLED LIST</a></li> 
        </ul> 
        <!-- Generic List and Detail Views --> 
        <a href="{% url 'student-list' %}">Generic Student List View</a> 
         
    </nav> 
    <section> 
        {% block content %} 
        <!-- Dynamic content goes here --> 
        {% endblock %} 
    </section> 
    <footer> 
        <hr /> 
        <p>&copy; Designed and Developed by Rishabh</p> 
    </footer> 
</body> 
</html>
